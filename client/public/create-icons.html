<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Nền gradient xanh
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#2563eb');
  g.addColorStop(1, '#1e40af');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.22);
  ctx.fill();

  // Bong bóng chat
  const p = size * 0.18;
  const w = size - p * 2;
  const h = w * 0.72;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.roundRect(p, p, w, h, size * 0.1);
  ctx.fill();

  // Đuôi bong bóng
  ctx.beginPath();
  ctx.moveTo(p + w * 0.18, p + h);
  ctx.lineTo(p + w * 0.06, p + h + size * 0.12);
  ctx.lineTo(p + w * 0.36, p + h);
  ctx.fill();

  // Ba gạch ngang bên trong
  ctx.fillStyle = '#2563eb';
  [[0.18, 0.22, 0.64],[0.18, 0.40, 0.64],[0.18, 0.58, 0.40]].forEach(([x,y,len]) => {
    ctx.beginPath();
    ctx.roundRect(p + w*x, p + h*y, w*len, size*0.07, size*0.035);
    ctx.fill();
  });

  const a = document.createElement('a');
  a.download = `icon-${size}x${size}.png`;
  a.href = canvas.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
alert('✅ Tải xong! Copy tất cả icons vào client/public/icons/');
</script>
</body>
</html>
